name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run full quality gate
        run: npm run check

      - name: Build and verify installer
        run: npm run package:win

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath (Resolve-Path 'release/win-unpacked/LockIn.exe') `
            -ArgumentList '--smoke-test' `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged application exited with code $($process.ExitCode)"
          }

      - name: Upload verified installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LockIn-Windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release -File | Where-Object {
            $_.Extension -eq '.exe' -or $_.Name.EndsWith('.sha256')
          }
          gh release create $env:GITHUB_REF_NAME $files.FullName `
            --verify-tag `
            --generate-notes `
            --title "LockIn $env:GITHUB_REF_NAME"
