appId: com.lockin.desktop
productName: LockIn

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true
compression: normal
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  executableName: LockIn
  artifactName: LockIn-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: LockIn
  uninstallDisplayName: LockIn
  deleteAppDataOnUninstall: false
  runAfterFinish: true
