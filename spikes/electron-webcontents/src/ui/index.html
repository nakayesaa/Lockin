<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LockIn Phase 1 Spike</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="mark"></span>
        <div>
          <strong>LockIn</strong>
          <small>Phase 1 · WebContentsView spike</small>
        </div>
      </div>
      <nav id="sites" aria-label="Reference websites"></nav>
      <button id="close-site" class="quiet" type="button">Spaces</button>
      <button id="cookie-check" class="quiet" type="button">Cookie check</button>
      <span id="status" role="status">Ready</span>
    </header>
    <main class="empty-state">
      <p>Select a reference website above.</p>
      <p class="hint">The LockIn bar remains visible while one remote view occupies this area.</p>
      <pre id="details"></pre>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
